[package]
name = "svod-model"
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bon = "3.9.1"
hf-hub = "0.5.0"
hound = "3.5.1"
svod-arch = { version = "0.1.0-alpha.2", path = "../arch" }
svod-device = { version = "0.1.0-alpha.2", path = "../device" }
svod-dtype = { version = "0.1.0-alpha.2", path = "../dtype", package = "svod-dtype" }
svod-ir = { version = "0.1.0-alpha.2", path = "../ir", package = "svod-ir" }
svod-macros = { version = "0.1.0-alpha.2", path = "../macros" }
svod-runtime = { version = "0.1.0-alpha.2", path = "../runtime" }
svod-tensor = { version = "0.1.0-alpha.2", path = "../tensor", package = "svod-tensor" }
ndarray.workspace = true
prost = "0.14.3"
nom = "7.1"
realfft = "3.5.0"
repugnant-pickle = { version = "0.0.1", features = ["torch"] }
safetensors = "0.7.0"
zip = { version = "0.6", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
snafu = "0.9.0"
tracing-subscriber = "0.3.23"

[dev-dependencies]
bytemuck = "1.25.0"
clap = { version = "4.5", features = ["derive"] }
ndarray-npy = "0.10"
tempfile = "3.27.0"
test-case = "3.3.1"
