[package]
name = "svod-tk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ThunderKittens-style tile DSL for authoring hand-tuned GPU kernels (gfx942)"

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.3" }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.3" }
svod-tensor = { path = "../tensor", version = "=0.1.0-alpha.3" }
smallvec = { workspace = true }
snafu = "0.8.9"
svod-codegen = { path = "../codegen", version = "=0.1.0-alpha.3" }
svod-device = { path = "../device", version = "=0.1.0-alpha.3" }
svod-runtime = { path = "../runtime", version = "=0.1.0-alpha.3" }
svod-schedule = { path = "../schedule", version = "=0.1.0-alpha.3" }

[dev-dependencies]
proptest = "1.9"
test-case = "3.3.1"
criterion = { version = "0.8", features = ["html_reports"] }

# GPU device-time benches (criterion). Self-skip when no AMD GPU; run with
# `SVOD_DEVICE=AMD:0 cargo bench -p svod-tk --bench kernels`.
[[bench]]
name = "kernels"
harness = false
